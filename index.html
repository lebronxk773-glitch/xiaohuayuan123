function initLens(){
 const box=$('#photo-area');if(!box)return;
 const im=$('img',box),lens=$('#lens');
 function move(e){
  if(!box.classList.contains('zoom-on'))return;
  const r=im.getBoundingClientRect(),br=box.getBoundingClientRect();
  // The image is contained. Derive its actual content rectangle to avoid sampling letterbox padding.
  const ratio=im.naturalWidth/im.naturalHeight;let w=r.width,h=r.width/ratio;
  if(h>r.height){h=r.height;w=h*ratio;}
  const ox=(r.width-w)/2,oy=(r.height-h)/2;
  let x=Math.max(0,Math.min(w,e.clientX-r.left-ox)),y=Math.max(0,Math.min(h,e.clientY-r.top-oy));
  const cx=x+ox+r.left-br.left,cy=y+oy+r.top-br.top;
  lens.style.display='block';lens.style.left=Math.max(-12,Math.min(br.width-142,cx-77))+'px';lens.style.top=Math.max(-12,Math.min(br.height-142,cy-77))+'px';
  lens.style.backgroundImage=`url("${im.src}")`;lens.style.backgroundSize=`${w*2.3}px ${h*2.3}px`;lens.style.backgroundPosition=`${77-x*2.3}px ${77-y*2.3}px`;
 }
 box.addEventListener('pointermove',move);box.addEventListener('pointerdown',e=>{if(box.classList.contains('zoom-on')){e.preventDefault();move(e);}});

}

const V6_TASKS=[
 {id:'explore',title:'找线索',short:'去花园看看',icon:'search'},

function v6Done(id){
 if(id==='explore')return state.collected.length===4;
 if(id==='compare')return classified();
 if(id==='verify')return state.conclusion===true;
 if(id==='replay')return state.replayStatus!=='none';
 if(id==='create')return state.creativeDone===true;
 if(id==='summary')return state.summaryViewed===true;
 return false;
}
function v6Unlocked(id){
 if(id==='explore')return true;
 if(id==='compare')return prefs.guide==='free'||v6Done('explore');
 if(id==='verify')return v6Done('explore')&&v6Done('compare');
 if(id==='replay')return v6Done('verify');
 if(id==='create')return v6Done('replay');
 if(id==='summary')return v6Done('create');
 return false;
}
function v6LockReason(id){
 if(id==='compare')return '跟我探案模式下，先找齐四条线索。';

 if(id==='summary')return '先完成一次新发现。';
 return '这个任务还没有解锁。';
}
function v6Stars(){return ['explore','compare','verify','replay','create'].filter(v6Done).length;}

 if(kind==='flowersup')return wrap(`<g stroke="${green}" stroke-width="7" stroke-linecap="round"><path d="M64 110V48M110 110V38M156 110V52"/></g><g fill="#f1cf5d"><circle cx="64" cy="43" r="17"/><circle cx="110" cy="33" r="17"/><circle cx="156" cy="47" r="17"/></g><g fill="#ef9db1"><circle cx="64" cy="43" r="7"/><circle cx="110" cy="33" r="7"/><circle cx="156" cy="47" r="7"/></g>`);
 if(kind==='rut')return wrap(`<path d="M35 36C77 58 132 79 186 105M25 61c48 23 99 46 151 70" stroke="#684c34" stroke-width="15" stroke-linecap="round" opacity=".9"/><path d="M39 33c18 9 39 18 55 25m20 11 57 27M29 58c19 10 36 17 57 27m22 11 51 23" stroke="#b68a62" stroke-width="4"/>`);

function v10ScenePane(){const h=v10Config.hotspots[v10SceneId],c=v10Config.covers[v10SceneId];return `<div class="v10-section-title"><div><h3>第一关 · 热点与遮挡编辑器</h3><p class="v10-sub">热点决定幼儿“点哪里”；遮挡只负责视觉悬念，两者相互独立。可直接拖动，也可以用滑杆微调。所有改动都能撤销或恢复默认。</p></div><div class="row"><button class="button secondary" data-v10-scene-undo ${v10SceneHistory.length?'':'disabled'}>↶ 撤销</button><button class="button secondary" data-v10-scene-redo ${v10SceneFuture.length?'':'disabled'}>↷ 重做</button></div></div><div class="v10-editor"><div>${v10ScenePreview()}<div class="v10-preview-strip"><span>黄色框：热点</span><span>虚线框：遮挡</span><span>幼儿模式不会显示编辑框</span><button class="button soft ${v10SceneHitTest?'selected':''}" data-v10-hit-test>${v10SceneHitTest?'✓ 正在测试点击':'🎯 测试点击范围'}</button></div></div><aside class="v10-card v10-editor-side"><label>编辑线索<select id="v10-scene-id">${clueIds.map(id=>`<option value="${id}" ${id===v10SceneId?'selected':''}>${CLUES[id].name}</option>`).join('')}</select></label><div class="v10-mode-row"><button class="v10-mode-chip ${v10SceneMode==='hotspot'?'active':''}" data-v10-scene-mode="hotspot">🎯 热点</button><button class="v10-mode-chip ${v10SceneMode==='cover'?'active':''}" data-v10-scene-mode="cover">🌿 遮挡</button></div>${v10SceneMode==='hotspot'?`<label>形状<select data-v10-hot-shape><option value="ellipse" ${h.shape==='ellipse'?'selected':''}>椭圆</option><option value="rect" ${h.shape==='rect'?'selected':''}>圆角矩形</option></select></label><label>X <input type="range" min="0" max="95" step="0.1" value="${h.x}" data-v10-hot-field="x"></label><label>Y <input type="range" min="0" max="95" step="0.1" value="${h.y}" data-v10-hot-field="y"></label><label>宽 <input type="range" min="4" max="60" step="0.1" value="${h.w}" data-v10-hot-field="w"></label><label>高 <input type="range" min="4" max="60" step="0.1" value="${h.h}" data-v10-hot-field="h"></label>`:`<label class="toggle-row"><span>启用这个遮挡</span><input type="checkbox" data-v10-cover-enabled ${c.enabled?'checked':''}></label><label>X function v10ProjectPane(){return `<h3>项目保存与迁移</h3><p class="v10-sub">浏览器中的替换图、热点、遮挡、BGM和媒体不会自动写回 HTML。请导出项目包，用于备份或合并到 GitHub 源码。</p>${v10PersistenceOK?'':`<div class="media-quality warn">⚠ 当前浏览器限制了持久化存储：本次替换仍可使用，但关闭页面前请导出项目包。</div>`}<div class="v10-grid"><div class="v10-card"><h4>完整项目包</h4><p>包含 Studio 配置、自定义图片/遮挡、背景音乐，以及已导入的视频和关卡音频。</p><div class="row"><button class="button primary" data-v10-export-project>${icon('download')}导出 V10 项目包</button><label class="button secondary v10-upload">导入项目包<input type="file" accept=".zip" data-v10-import-project></label></div></div><div class="v10-card"><h4>恢复与课堂重置</h4><p>恢复 Studio 默认只还原教师设置和素材；“新一班”只清幼儿进度，保留你的媒体和素材。</p><div class="row"><button class="button secondary" data-action="reset">新一班开始</button><button class="button ghost" data-v10-reset-studio>恢复 Studio 默认</button></div></div></div><div class="v10-card v10-danger" style="margin-top:16px"><h4>GitHub 使用</h4><p>源码版已经加载 <code>config/studio-config.js</code>。导出的项目包含同名配置与 <code>media/studio/</code> 素材，合并到源码根目录即可作为网站默认素材。</p></div>`;}

function showV10Studio(tab='levels'){v10StudioTab=V10_TABS.some(x=>x[0]===tab)?tab:'levels';openModal('教师工作台 · V10 Studio','幼儿端保持简单；所有高级功能集中在这里。',`<div class="v10-studio-shell">${v10StudioNav()}<section class="v10-studio-main">${v10StudioPane()}</section></div>`,false,'studio');$('#modal').classList.add('v10-studio-modal');if(v10StudioTab==='scene')v10BindSceneEditor();}

/* Scene editor drag/resize */
function v10PointHit(px,py){const hits=[];for(const id of clueIds){const h=v10Config.hotspots[id];let yes=false;if(h.shape==='rect')yes=px>=h.x&&px<=h.x+h.w&&py>=h.y&&py<=h.y+h.h;else{const cx=h.x+h.w/2,cy=h.y+h.h/2,rx=h.w/2,ry=h.h/2;yes=rx>0&&ry>0&&(((px-cx)/rx)**2+((py-cy)/ry)**2<=1);}if(yes)hits.push(id);}return hits;}
function v10BindSceneEditor(){v10SceneCleanup?.();const pre=$('#v10-scene-preview');if(!pre)return;let dragState=null;const down=e=>{if(v10SceneHitTest){const r=pre.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*100,py=(e.clientY-r.top)/r.height*100,hits=v10PointHit(px,py);v10SceneHitResult=hits.length?`命中：${hits.map(id=>CLUES[id].name).join('、')} · (${px.toFixed(1)}%, ${py.toFixed(1)}%)`:`未命中任何线索 · (${px.toFixed(1)}%, ${py.toFixed(1)}%)`;const out=pre.querySelector('.v10-hit-test-status');if(out)out.textContent=v10SceneHitResult;e.preventDefault();return;}const hot=e.target.closest('[data-v10-editor-hotspot]'),cov=e.target.closest('[data-v10-editor-cover]');if(!hot&&!cov)return;const id=(hot||cov).dataset[hot?'v10EditorHotspot':'v10EditorCover'];if(id!==v10SceneId)return;const mode=hot?'hotspot':'cover';if(mode!==v10SceneMode)return;e.preventDefault();v10PushSceneHistory();const r=pre.getBoundingClientRect(),obj=mode==='hotspot'?v10Config.hotspots[id]:v10Config.covers[id];dragState={mode,id,startX:e.clientX,startY:e.clientY,base:{...obj},resize:!!e.target.closest('[data-v10-resize]'),rect:r,pointer:e.pointerId};(hot||cov).setPointerCapture?.(e.pointerId);};const move=e=>{if(!dragState)return;const d=dragState,dx=(e.clientX-d.startX)/d.rect.width*100,dy=(e.clientY-d.startY)/d.rect.height*100,obj=d.mode==='hotspot'?v10Config.hotspots[d.id]:v10Config.covers[d.id];if(d.resize){obj.w=Math.max(4,Math.min(100-obj.x,d.base.w+dx));obj.h=Math.max(4,Math.min(100-obj.y,d.base.h+dy));}else{obj.x=Math.max(0,Math.min(100-obj.w,d.base.x+dx));obj.y=Math.max(0,Math.min(100-obj.h,d.base.y+dy));}v10SaveConfig();v10ApplyHotspots();const el=pre.querySelector(d.mode==='hotspot'?`[data-v10-editor-hotspot="${d.id}"]`:`[data-v10-editor-cover="${d.id}"]`);if(el){el.style.left=obj.x+'%';el.style.top=obj.y+'%';el.style.width=obj.w+'%';el.style.height=obj.h+'%';}};const up=()=>{if(!dragState)return;dragState=null;showV10Studio('scene');};pre.addEventListener('pointerdown',down);pre.addEventListener('pointermove',move);pre.addEventListener('pointerup',up);pre.addEventListener('pointercancel',up);v10SceneCleanup=()=>{pre.removeEventListener('pointerdown',down);pre.removeEventListener('pointermove',move);pre.removeEventListener('pointerup',up);pre.removeEventListener('pointercancel',up);};}

/* Project deployment/backup */
function v10Ext(name,fallback){const x=(name||'').split('.').pop().toLowerCase();return /^[a-z0-9]{1,6}$/.test(x)?x:fallback;}
async function v10ExportProject(){const entries=[],records=[],studio={schema:10,config:v10Config,assets:{},bgm:null};let total=0;for(const [slot,item] of Object.entries(v10AssetFiles)){if(!item?.file)continue;const ext=v10Ext(item.name,'png'),safe=slot.replace(/[:/]/g,'_'),path=`media/studio/images/${safe}.${ext}`;entries.push({name:path,blob:item.file});records.push({kind:'image',id:slot,path,name:item.name,type:item.type});studio.assets[slot]={src:'./'+path,name:item.name};total+=item.file.size;}
 if(v10Bgm?.file){const ext=v10Ext(v10Bgm.name,'mp3'),path=`media/studio/bgm/main.${ext}`;entries.push({name:path,blob:v10Bgm.file});records.push({kind:'bgm',id:'main',path,name:v10Bgm.name,type:v10Bgm.type});studio.bgm={src:'./'+path,name:v10Bgm.name};total+=v10Bgm.file.size;}
 const mediaConfig={schema:5,settings:{...prefs,remember:false},videos:{},voices:{}};for(const [kind,map] of [['video',media],['voice',voiceFiles]])for(const [id,m] of Object.entries(map)){if(!m?.file)continue;const ext=v10Ext(m.name,kind==='video'?'mp4':'mp3'),path=kind==='video'?`media/${id}.${ext}`:`media/voice/${id}.${ext}`;entries.push({name:path,blob:m.file});records.push({kind,id,path,name:m.name,type:m.type});mediaConfig[kind==='video'?'videos':'voices'][id]={src:'./'+path,name:m.name};total+=m.file.size;}
